[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "nltk==3.10.3",
    "openai==3.6.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-ai==2.37.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "alembic==1.19.1",
    "docling==2.126.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "ipykernel==7.3.0",
    "nest-asyncio==1.6.0",
    "openai==3.6.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-ai==2.37.0",
    "pydantic-settings==2.15.0",
    "pytest==9.1.1",
    "ruff==0.16.5",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.52.4",
]
